# BT Passthrough
CONFIG_BT_PASSTHRU=y

# --- CRITICAL: Buffer Allocation ---
# The hci_cnvi driver pre-allocates one CMD TX buf as its internal IPM send scratch
# buffer. Your zephyr_bt_sender.cc will allocate a second buffer dynamically.
# Set this to at least 3 to be safe against allocation failures under heavy load.
CONFIG_BT_BUF_CMD_TX_COUNT=3

# --- CRITICAL: ISH Priority Workaround ---
# The BT subsystem requires SYSTEM_WORKQUEUE_PRIORITY in [-256,-1].
# This must be included or the ISH Zephyr build will fail the assertion check.
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
