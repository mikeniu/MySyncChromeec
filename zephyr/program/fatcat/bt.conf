# BT Passthrough
CONFIG_BT_PASSTHRU=y
CONFIG_BT_HCI_CNVI=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_PASSTHRU_LOG_LEVEL_DBG=y
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_DBG=y
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_PLATFORM_EC_LOG_BACKEND_CONSOLE_BUFFER=y
CONFIG_PLATFORM_EC_HOSTCMD_CONSOLE_BUF_SIZE=8192

# --- CRITICAL: Buffer Allocation ---
# The hci_cnvi driver pre-allocates one CMD TX buf as its internal IPM send
# scratch buffer. Your zephyr_bt_sender.cc will allocate a second buffer
# dynamically. Set this to at least 3 to be safe against allocation failures
# under heavy load.
CONFIG_BT_BUF_CMD_TX_COUNT=3

# --- CRITICAL: ISH Priority Workaround ---
# The BT subsystem requires SYSTEM_WORKQUEUE_PRIORITY in [-256,-1].
# This must be included or the ISH Zephyr build will fail the assertion check.
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
