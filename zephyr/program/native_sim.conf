CONFIG_EMUL=y
CONFIG_FLASH=y
CONFIG_I2C_INIT_PRIORITY=39
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_POSIX_ARCH_CONSOLE_INIT_PRIORITY=60
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_LOG_BACKEND_NATIVE_POSIX=n
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n
CONFIG_PLATFORM_EC_HOSTCMD=y
CONFIG_PLATFORM_EC_VBOOT_EFS2=n

# eSPI peripheral capabilities matching IT8xxx2 / NPCX
CONFIG_EMUL_ESPI_HOST=y
CONFIG_ESPI_OOB_CHANNEL=y
CONFIG_ESPI_PERIPHERAL_8042_KBC=y
CONFIG_ESPI_PERIPHERAL_HOST_IO=y
CONFIG_ESPI_PERIPHERAL_HOST_IO_PVT=y
CONFIG_ESPI_PERIPHERAL_DEBUG_PORT_80=y
CONFIG_ESPI_PERIPHERAL_EC_HOST_CMD=y
CONFIG_ESPI_PERIPHERAL_ACPI_SHM_REGION=y
CONFIG_ESPI_PERIPHERAL_CUSTOM_OPCODE=y
CONFIG_ESPI_FLASH_CHANNEL=y
