CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_LIBGCC_RTLIB=y
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_CBPRINTF_COMPLETE=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=n
CONFIG_PLATFORM_EC_LOG_BACKEND_CONSOLE_BUFFER=y

# Pigweed
CONFIG_PIGWEED_ASSERT_ZEPHYR=y
CONFIG_PIGWEED_CHRONO_SYSTEM_CLOCK=y
CONFIG_PIGWEED_SYNC_MUTEX=y
CONFIG_PIGWEED_LOG_ZEPHYR=y

# CHRE
CONFIG_SCP_CHRE=y
CONFIG_CHRE_DYNAMIC_MEMORY_SIZE=16384
