CONFIG_CROS_EC=y
CONFIG_PLATFORM_EC=y
CONFIG_SHIMMED_TASKS=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_SHELL=y

CONFIG_AP=n
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_CBI=n
CONFIG_PLATFORM_EC_HIBERNATE=n

CONFIG_CROS_EC_PROGRAM_MEMORY_BASE=0
CONFIG_CROS_EC_RAM_BASE=0
CONFIG_CROS_EC_DATA_RAM_SIZE=0x340000
CONFIG_CROS_EC_RAM_SIZE=0x360000
CONFIG_CROS_EC_RO_MEM_OFF=0
CONFIG_CROS_EC_RW_MEM_OFF=0

CONFIG_IPM=y
CONFIG_IPM_MTK_SCP=y

CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_I2C_MTK_SCP=y

# Sensors
CONFIG_PLATFORM_EC_MOTIONSENSE=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCELS=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_ACCEL_INFO=y
CONFIG_PLATFORM_EC_ACCEL_FIFO=y
CONFIG_PLATFORM_EC_SENSOR_TIGHT_TIMESTAMPS=y
