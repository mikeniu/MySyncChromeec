# wclffb board-specific Kconfig settings.

CONFIG_BOARD_WCLFFB=y

CONFIG_PLATFORM_EC_KEYBOARD_CUSTOMIZATION=y

# AP to EC communication
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S3=y
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S4=y
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S5=y
CONFIG_PLATFORM_EC_POWER_BUTTON_IGNORE_LID=y
# CONFIG_HCDEBUG_OFF=y

# Input
CONFIG_PLATFORM_EC_VOLUME_BUTTONS=n

# Lid
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n

# EFS2
CONFIG_PLATFORM_EC_VBOOT_EFS2=n

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_STRAUSS=y
CONFIG_PLATFORM_EC_KEYBOARD_COLS=16

# Power sequence
# CONFIG_PLATFORM_EC_POWERSEQ_S0IX=n
CONFIG_AP_PWRSEQ_S0IX=n
CONFIG_AP_PWRSEQ_HOST_SLEEP=y

# Charger
CONFIG_PLATFORM_EC_CHARGER_RAA489110=n
CONFIG_PLATFORM_EC_CHARGER_SGM41538=y

# Disable options not yet configured
CONFIG_PLATFORM_EC_DEDICATED_CHARGE_PORT=n
CONFIG_PLATFORM_EC_BATTERY_PRESENT_GPIO=y
CONFIG_PLATFORM_EC_BATTERY_PRESENT_NONE=n

# UCSI PPM
CONFIG_UCSI_PPM=n

# USB-C PD
CONFIG_PLATFORM_EC_USB_CHARGER=n                  #No BC12 component
CONFIG_PLATFORM_EC_USB_MUX_TASK=n
CONFIG_PLATFORM_EC_USB_PD_CONTROLLER=n
CONFIG_PLATFORM_EC_USB_PD_VBUS_MEASURE_PDC=n
CONFIG_PLATFORM_EC_USB_POWER_DELIVERY=y
CONFIG_PLATFORM_EC_USBC_SS_MUX=y                  #kingler y
CONFIG_USBC_PDC_DRIVEN_CCD=n
CONFIG_PDC_RUNTIME_PORT_CONFIG=n
CONFIG_USBC_PDC_TPS6699X_CONSOLE_FW_UPDATER=n

# USB-C: TCPM & TCPC
CONFIG_PLATFORM_EC_USBC=y
CONFIG_PLATFORM_EC_USBC_PPC=n
CONFIG_PLATFORM_EC_USBC_PPC_SYV682X=n
CONFIG_PLATFORM_EC_USB_PD_TCPMV2=y
CONFIG_PLATFORM_EC_USB_PD_TCPM_ANX7447=y          # CONFIG_PLATFORM_EC_USB_PD_TCPM_ANX7406
CONFIG_PLATFORM_EC_USB_PD_TCPM_TCPCI=y
# TCPC interrupts are shared with BC1.2 and require additional processing
# to ensure interrupts can't be lost due to shared use.
CONFIG_PLATFORM_EC_TCPC_INTERRUPT=y
CONFIG_PLATFORM_EC_USBC_VCONN=y
CONFIG_PLATFORM_EC_USB_PD_TCPC_VCONN=y
CONFIG_PLATFORM_EC_USB_PD_VBUS_MEASURE_CHARGER=n  #kingler n
CONFIG_PLATFORM_EC_USB_PD_VBUS_MEASURE_BY_BOARD=y #kingler y
CONFIG_PLATFORM_EC_USB_PD_DISCHARGE=y             #kingler y
CONFIG_PLATFORM_EC_USB_PD_DISCHARGE_PPC=n         #No ppc component
CONFIG_PLATFORM_EC_USB_PD_DISCHARGE_TCPC=y
CONFIG_PLATFORM_EC_USB_PD_VBUS_DETECT_CHARGER=n
CONFIG_PLATFORM_EC_USB_PD_VBUS_DETECT_PPC=n
CONFIG_PLATFORM_EC_USB_PD_VBUS_DETECT_TCPC=y
CONFIG_PLATFORM_EC_USB_PD_MAX_POWER_MW=65000
CONFIG_PLATFORM_EC_USB_PD_MAX_CURRENT_MA=3250
CONFIG_PLATFORM_EC_USB_PD_MAX_VOLTAGE_MV=20000
CONFIG_PLATFORM_EC_USB_VID=0x18d1
CONFIG_PLATFORM_EC_USB_PID=0x505a
# USB4 and TBT are unsupported
CONFIG_PLATFORM_EC_USB_PD_USB4=n
CONFIG_PLATFORM_EC_USB_PD_TBT_COMPAT_MODE=n
CONFIG_PLATFORM_EC_USB_PD_REQUIRE_AP_MODE_ENTRY=n

# Bring up configs
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y
CONFIG_USBC_PDC_RTS54XX_CONSOLE_FW_UPDATER=n
