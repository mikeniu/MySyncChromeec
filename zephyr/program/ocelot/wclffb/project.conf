# wclffb board-specific Kconfig settings.

CONFIG_BOARD_WCLFFB=y

CONFIG_TASK_CHARGER_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=2048

CONFIG_PLATFORM_EC_KEYBOARD_CUSTOMIZATION=y

# AP to EC communication
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S3=y
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S4=y
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S5=y
CONFIG_PLATFORM_EC_POWER_BUTTON_IGNORE_LID=y
# CONFIG_HCDEBUG_OFF=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_CHARGER_DUMP=y

# Input
CONFIG_PLATFORM_EC_VOLUME_BUTTONS=n

# Lid
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n

# EFS2
CONFIG_PLATFORM_EC_VBOOT_EFS2=n

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_STRAUSS=y
CONFIG_PLATFORM_EC_KEYBOARD_COLS=16

# Power sequence
# CONFIG_PLATFORM_EC_POWERSEQ_S0IX=n
CONFIG_AP_PWRSEQ_S0IX=n
CONFIG_AP_PWRSEQ_HOST_SLEEP=y

# Charger
CONFIG_PLATFORM_EC_CHARGER_RAA489110=n
CONFIG_PLATFORM_EC_CHARGER_SGM41580=y

# Disable options not yet configured
CONFIG_PLATFORM_EC_DEDICATED_CHARGE_PORT=n
CONFIG_PLATFORM_EC_BATTERY_PRESENT_GPIO=y
CONFIG_PLATFORM_EC_BATTERY_PRESENT_NONE=n

# PDC
CONFIG_PDC_RUNTIME_PORT_CONFIG=n
CONFIG_USBC_PDC_TPS6699X_CONSOLE_FW_UPDATER=n
CONFIG_PLATFORM_EC_USB_PD_MAX_VOLTAGE_MV=20000
CONFIG_PLATFORM_EC_USB_PD_MAX_POWER_MW=65000
CONFIG_PLATFORM_EC_USB_PD_MAX_CURRENT_MA=3250

# Bring up configs
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y
CONFIG_USBC_PDC_RTS54XX_CONSOLE_FW_UPDATER=n

# Fan
CONFIG_PLATFORM_EC_NUM_FANS=2
