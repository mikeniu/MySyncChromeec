# libra board-specific Kconfig settings.

CONFIG_BOARD_LIBRA=y

# Open bring up configs
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y

# AP to EC communication
CONFIG_AP_PWRSEQ_DRIVER=y
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S3=n
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S4=n
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S5=y
CONFIG_PLATFORM_EC_POWER_BUTTON_IGNORE_LID=y
CONFIG_PLATFORM_EC_HOSTCMD=y

# EFS2
CONFIG_PLATFORM_EC_VBOOT_EFS2=y

# Buttons
CONFIG_PLATFORM_EC_BUTTON=y
CONFIG_PLATFORM_EC_POWER_BUTTON=y
CONFIG_PLATFORM_EC_VOLUME_BUTTONS=n

# Battery
CONFIG_PLATFORM_EC_BATTERY_REPLACE_NULLS=n
CONFIG_PLATFORM_EC_BATTERY_PRESENT_NONE=y
CONFIG_PLATFORM_EC_BATTERY_PRESENT_GPIO=n

# Charger
CONFIG_PLATFORM_EC_CHARGER_BQ25720=y

# PD USB-C
CONFIG_PDC_RUNTIME_PORT_CONFIG=n
CONFIG_USBC_PDC_TPS6699X_CONSOLE_FW_UPDATER=n
CONFIG_USBC_PDC_RTS54XX_CONSOLE_FW_UPDATER=y
CONFIG_PLATFORM_EC_USB_PD_MAX_VOLTAGE_MV=20000
CONFIG_PLATFORM_EC_USB_PD_MAX_POWER_MW=65000
CONFIG_PLATFORM_EC_USB_PD_MAX_CURRENT_MA=3250

# UCSI PPM
CONFIG_UCSI_PPM=y

# Keyboard
CONFIG_CROS_EC_KEYBOARD_INPUT=y
CONFIG_PLATFORM_EC_KEYBOARD=y
CONFIG_PLATFORM_EC_KEYBOARD_CUSTOMIZATION=y
CONFIG_PLATFORM_EC_KEYBOARD_PROTOCOL_8042=y

# Fan
CONFIG_PLATFORM_EC_NUM_FANS=1

# Lid
CONFIG_PLATFORM_EC_SWITCH=y
CONFIG_PLATFORM_EC_LID_SWITCH=y
