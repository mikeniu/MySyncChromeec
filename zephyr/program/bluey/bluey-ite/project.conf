# bluey board-specific Kconfig settings.

CONFIG_BOARD_BLUEY_ITE=y

CONFIG_PLATFORM_EC_CUSTOM_FAN_DUTY_CONTROL=y

# Disable HW SHA256 acceleration to prevent linker errors when vboot hash is disabled
CONFIG_SOC_IT8XXX2_SHA256_HW_ACCELERATE=n
