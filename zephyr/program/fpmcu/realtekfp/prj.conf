CONFIG_BOARD_REALTEKFP=y

# MPU
CONFIG_MPU=y
CONFIG_ARM_MPU=y
CONFIG_MPU_DISABLE_BACKGROUND_MAP=y
CONFIG_CPU_HAS_CUSTOM_FIXED_SOC_MPU_REGIONS=y

# Power Management
CONFIG_PM=n
CONFIG_PM_DEVICE=n

# Peripherials
CONFIG_BBRAM=n
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_INIT_PRIORITY=15
# CONFIG_CACHE_ANDES_INIT_PRIORITY=10
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
CONFIG_REGULATOR=y
CONFIG_GPIO=y

# Hwinfo
CONFIG_HWINFO=n

# Priorities
CONFIG_PLATFORM_EC_SYSTEM_PRE_INIT_PRIORITY=72

# Host Commands
CONFIG_EC_HOST_CMD_INITIALIZE_AT_BOOT=y
CONFIG_EC_HOST_CMD_HANDLER_RX_BUFFER_SIZE=528
CONFIG_EC_HOST_CMD_HANDLER_TX_BUFFER_SIZE=520

# Leave printk untill firmware is fully developed.
CONFIG_LOG_PRINTK=n

# Enable USB for HC
CONFIG_UDC_DRIVER=y
CONFIG_USB_DEVICE_STACK_NEXT=y
# Config to full speed since it is not support in usb host cmd yet
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n
CONFIG_USBD_MAX_SPEED_FULL=y
CONFIG_UDC_BUF_POOL_SIZE=3072
CONFIG_USB_DEVICE_MAX_POWER=250

CONFIG_USB_DEVICE_MANUFACTURER="Google"
CONFIG_USB_DEVICE_PRODUCT="FPMCU"
CONFIG_USB_DEVICE_VID=0x18D1
CONFIG_USB_DEVICE_PID=0x5817
CONFIG_USB_DEVICE_SELF_POWERED=n
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y
CONFIG_USB_DEVICE_SN="0"

# Use USB for signaling MKBP events
CONFIG_PLATFORM_EC_MKBP_USE_GPIO=n
CONFIG_PLATFORM_EC_MKBP_USE_USB=y

# Flash
CONFIG_FLASH_EX_OP_ENABLED=y
CONFIG_FLASH_RTS5817_WRITE_PROTECTION_AUTO=n

# OTP
CONFIG_RTKFP_OTP_KEY=y
