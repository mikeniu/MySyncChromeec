# Force NUM_IRQS to 150 to override any dynamic calculation that Zephyr does
# based on peripherals enabled in devicetree.
# This is necessary for RW FWID offset to match the address expected by the RO
# firmware. The RW FWID is located 4 bytes into a fixed linked section placed
# directly after the vector table. If the size of the vector table is lower,
# the RW FWID is placed under a lower address, which does not match the offset
# expected by RO and fails the build.
CONFIG_NUM_IRQS=150

CONFIG_BOARD_DARTMONKEY=y

# The NULL pointer exception page size must be a power of two
# and have size greater or equal ARM_MPU_REGION_MIN_ALIGN_AND_SIZE
CONFIG_CORTEX_M_NULL_POINTER_EXCEPTION_PAGE_SIZE=0x80

# Peripherals
CONFIG_COUNTER=y
CONFIG_DMA=y

# Power Management
CONFIG_PM=y

# TODO: uncomment these options back and disable EXCEPTION_DEBUG
# CONFIG_EXCEPTION_DEBUG=n
# CONFIG_PLATFORM_EC_PANIC_STRIP_GPR=y
CONFIG_EXCEPTION_DEBUG=y
CONFIG_PLATFORM_EC_PANIC_STRIP_GPR=n

# Hwinfo (used by cros-system driver for STM32)
CONFIG_HWINFO=y

# STM32 flash driver options
CONFIG_FLASH_STM32_READOUT_PROTECTION=y
CONFIG_FLASH_STM32_WRITE_PROTECT=y
CONFIG_FLASH_STM32_BLOCK_REGISTERS=y

# STM32 entropy driver options
CONFIG_ENTROPY_STM32_THR_POOL_SIZE=32
CONFIG_ENTROPY_STM32_THR_THRESHOLD=16

# IWDG watchdog
CONFIG_IWDG_STM32_INITIAL_TIMEOUT=10000
CONFIG_PLATFORM_EC_WATCHDOG_PERIOD_MS=10000
CONFIG_PLATFORM_EC_WATCHDOG_WARNING_LEADING_TIME_MS=3000
CONFIG_PLATFORM_EC_WATCHDOG_HELPER=y

# Set HOOK_TICK INTERVAL in microseconds to reload watchdog
CONFIG_CROS_EC_HOOK_TICK_INTERVAL=500000

# CrOS drivers
CONFIG_CROS_FLASH_READOUT_PROTECTION=y
CONFIG_CROS_SYSTEM_STM32=y

# Priorities
CONFIG_PLATFORM_EC_FLASH_INIT_PRIORITY=60
CONFIG_CROS_SYSTEM_INIT_PRIORITY=71
CONFIG_PLATFORM_EC_SYSTEM_PRE_INIT_PRIORITY=72

# Host Commands
CONFIG_EC_HOST_CMD_INITIALIZE_AT_BOOT=y
CONFIG_EC_HOST_CMD_HANDLER_TX_BUFFER_SIZE=552
CONFIG_EC_HOST_CMD_HANDLER_RX_BUFFER_SIZE=544
CONFIG_EC_HOST_CMD_BACKEND_SPI=y

# Allow usage of "%l" and "%i"
CONFIG_PLATFORM_EC_PRINTF_LONG_IS_32BITS=y

# Enable DMA for SPI, which is used for communication with a sensor
CONFIG_SPI_STM32_DMA=y

# Enable and create uncacheable buffers needed for DMA
CONFIG_NOCACHE_MEMORY=y
CONFIG_DCACHE=y

# Clear MPU and cache before boot
CONFIG_INIT_ARCH_HW_AT_BOOT=y
