common:
  platform_allow:
    - native_sim
tests:
  switchcap.default:
    extra_configs:
      - CONFIG_CROS_SWITCHCAP_PG_GPIO=y
  switchcap.adc:
    extra_dtc_overlay_files:
      - boards/adc.overlay
    extra_configs:
      - CONFIG_ADC=y
      - CONFIG_ADC_EMUL=y
      - CONFIG_CROS_SWITCHCAP_PG_ADC=y
