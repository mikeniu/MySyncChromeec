common:
  platform_allow:
    - native_sim
tests:
  qcom_ap_pwrseq.default: {}
  qcom_ap_pwrseq.sysjump_s0:
    extra_args: EXTRA_CFLAGS=-DTEST_SYSJUMP_S0
  qcom_ap_pwrseq.sysjump_s3:
    extra_args: EXTRA_CFLAGS=-DTEST_SYSJUMP_S3
  qcom_ap_pwrseq.sysjump_g3:
    extra_args: EXTRA_CFLAGS=-DTEST_SYSJUMP_G3
