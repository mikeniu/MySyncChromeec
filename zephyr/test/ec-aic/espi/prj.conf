CONFIG_PLATFORM_EC=y
CONFIG_CROS_EC=y
CONFIG_CROS_EC_RO=y
CONFIG_SYSCON=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_ESPI=y
CONFIG_ESPI_VWIRE_CHANNEL=y
CONFIG_ESPI_AUTOMATIC_WARNING_ACKNOWLEDGE=y
CONFIG_ESPI_AUTOMATIC_BOOT_DONE_ACKNOWLEDGE=y

CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_SWITCH=n
CONFIG_PLATFORM_EC_I2C=n
CONFIG_NAMED_ADC_CHANNELS=n
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_KEYBOARD=n
CONFIG_PLATFORM_EC_POWER_BUTTON=n
CONFIG_PLATFORM_EC_SHA256_HW_ACCELERATE=n
CONFIG_PLATFORM_EC_VBOOT_HASH=n
CONFIG_EC_HOST_CMD=n
CONFIG_PLATFORM_EC_HOSTCMD=n
CONFIG_PLATFORM_EC_FAN=n

CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y
