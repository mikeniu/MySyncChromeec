common:
  platform_allow:
    - native_sim
tests:
  ocelot.ocelotrvp_npcx.board_power:
    extra_dtc_overlay_files:
      - boards/ocelot.dtsi
      - boards/ocelotrvp_npcx/ocelotrvp_npcx.dtsi
    extra_conf_files:
      - boards/ocelotrvp_npcx/ocelotrvp_npcx.conf
    extra_configs:
      - CONFIG_TEST_PROJECT_OCELOTRVP_NPCX=y
      - CONFIG_TEST_PROJECT_OCELOT_BOARD_POWER=y
      - CONFIG_AP_POWER_EVENTS_MOCK=y
      - CONFIG_POWER_SIGNALS_MOCK=y
      - CONFIG_CHIPSET_API_MOCK=y
      - CONFIG_AP_EVENTS=n
