common:
  platform_allow:
    - native_sim
tests:
  atria.rvp_usbc_runtime.3port:
    extra_configs:
      - CONFIG_TEST_ATRIA_RVP_USBC_RUNTIME_3PORT=y
      - CONFIG_PDC_RUNTIME_PORT_CONFIG=y
    extra_dtc_overlay_files:
      - "boards/native_sim_3port.overlay"
  atria.rvp_usbc_runtime.2port:
    extra_configs:
      - CONFIG_TEST_ATRIA_RVP_USBC_RUNTIME_2PORT=y
      - CONFIG_PDC_RUNTIME_PORT_CONFIG=y
    extra_dtc_overlay_files:
      - "boards/native_sim_2port.overlay"
  atria.rvp_usbc_runtime.none:
    extra_configs:
      - CONFIG_TEST_ATRIA_RVP_USBC_RUNTIME_NONE=y
      - CONFIG_PDC_RUNTIME_PORT_CONFIG=y
    extra_dtc_overlay_files:
      - "boards/native_sim_none.overlay"
  atria.rvp_usbc_runtime.c0only:
    extra_configs:
      - CONFIG_TEST_ATRIA_RVP_USBC_RUNTIME_C0_ONLY=y
      - CONFIG_PDC_RUNTIME_PORT_CONFIG=y
    extra_dtc_overlay_files:
      - "boards/native_sim_c0only.overlay"
  atria.rvp_usbc_runtime.unsupported:
    extra_configs:
      - CONFIG_TEST_ATRIA_RVP_USBC_RUNTIME_UNSUPPORTED=y
      - CONFIG_PDC_RUNTIME_PORT_CONFIG=y
    extra_dtc_overlay_files:
      - "boards/native_sim_unsupported.overlay"
