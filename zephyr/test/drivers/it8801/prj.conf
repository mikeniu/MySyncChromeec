# Test framework
CONFIG_ZTEST=y

# Required subsystems
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y

# Input subsystem
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
CONFIG_INPUT_ITE_IT8801_KBD=y

# MFD support (driver disabled, we provide stubs)
CONFIG_MFD=y
CONFIG_MFD_ITE_IT8801=n

# Power management for PM callbacks
CONFIG_PM_DEVICE=y

# I2C emulation utilities
CONFIG_EMUL_COMMON_I2C=y
