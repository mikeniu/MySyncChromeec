description: |
  Runtime keys definition.

  This can be used to define the key combinations that trigger runtime key
  events for reboot and hibernate. Note that the volume up key combination is
  obtained automatically from the Vivaldi configuration node, which allows
  selecting different mappings at boot time..

  Example configuration:

  kbd {
      runtime-keys {
          compatible = "cros-ec,runtime-keys";
          left-alt-rc = <KBD_RC(0, 10)>;
          right-alt-rc = <KBD_RC(6, 10)>;
          h-rc = <KBD_RC(1, 6)>;
          r-rc = <KBD_RC(7, 3)>;
      };
  };

compatible: "cros-ec,runtime-keys"

include: base.yaml

properties:
  left-alt-rc:
    type: int
    required: true
    description: Row-column position of the "left alt" key.

  right-alt-rc:
    type: int
    required: true
    description: Row-column position of the "right alt" key.

  h-rc:
    type: int
    required: true
    description: Row-column position of the "h" key.

  r-rc:
    type: int
    required: true
    description: Row-column position of the "r" key.

  vol-up-rc:
    type: int
    description: |
      Row-column position of the "volume up" key, only required when using the
      MKBP keyboard protocol.

  alt-left-alt-rc:
    type: int
    description: |
      Row-column position of the "left alt" key after
      runtime_keys_use_alternate(), defaults to left-alt-rc.

  alt-right-alt-rc:
    type: int
    description: |
      Row-column position of the "right alt" key after
      runtime_keys_use_alternate(), defaults to right-alt-rc.

  alt-h-rc:
    type: int
    description: |
      Row-column position of the "h" key after
      runtime_keys_use_alternate(), defaults to h-rc.

  alt-r-rc:
    type: int
    description: |
      Row-column position of the "r" key after
      runtime_keys_use_alternate(), defaults to r-rc.
