description: |
  Fn keys definition

  This can be used to TODO TODO TODO

  Example configuration:

  kbd {
      fn-keys {
          compatible = "cros-ec,fn-keys";

          fn-rc = <KBD_RC(2, 0)>;
          keymap = <
            MATRIX_KEY(1, 1, KBD_SCANCODE_F1)
            MATRIX_KEY(0, 2, KBD_SCANCODE_F2)
            ...
            MATRIX_KEY(0, 4, KBD_SCANCODE_F11)
            MATRIX_KEY(3, 9, KBD_SCANCODE_F12)
          >;
      };
  };

compatible: "cros-ec,fn-keys"

include: base.yaml

properties:
  fn-rc:
    type: int
    required: true
    description: Row-column position of the "Fn" key.

  keymap:
    type: array
    required: true
    description: |
      List of row, key and codes, using the MATRIX_KEY() macro.

  alt-fn-rc:
    type: int
    description: |
      Row-column position of the "Fn" key after
      fn_keys_use_alternate(), defaults to fn-rc.

  alt-keymap:
    type: array
    description: |
      Keymap used after fn_keys_use_alternate(), must have the same number
      of entries as keymap.
