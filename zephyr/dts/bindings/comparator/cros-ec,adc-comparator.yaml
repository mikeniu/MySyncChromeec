description: ChromiumOS ADC-backed voltage comparator

compatible: "cros-ec,adc-comparator"

include: voltage-divider-common.yaml

properties:
  output-ohms:
    default: 1

  threshold-mv:
    type: int
    required: true
    description:
      Voltage threshold in millivolts above which the comparator output is high.
