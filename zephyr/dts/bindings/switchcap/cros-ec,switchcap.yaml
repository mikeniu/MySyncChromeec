description: ChromiumOS Switchcap driver

compatible: "cros-ec,switchcap"

include: base.yaml

properties:
  enable-gpios:
    type: phandle-array
    required: true
    description: GPIO used to enable the switchcap converter.

  power-good-gpios:
    type: phandle-array
    description: GPIO used to monitor the power-good status of the switchcap.

  power-good-comp:
    type: phandle
    description:
      Comparator device used to monitor the power-good status of the switchcap.

  power-off-delay-ms:
    type: int
    description:
      Optional delay in milliseconds to wait after disabling the switchcap
      before returning.
