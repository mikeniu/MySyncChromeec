description: ChromiumOS Switchcap Driver

compatible: "cros-ec,switchcap"

properties:
  enable-gpios:
    type: phandle-array
    required: true
    description: Output GPIO used to enable the switchcap.

  power-good-gpios:
    type: phandle-array
    description: Input GPIO used to read switchcap power-good status.

  io-channels:
    type: phandle-array
    description: ADC channel used to read switchcap power-good voltage.

  power-good-threshold-mv:
    type: int
    default: 2000
    description: Voltage threshold in mV above which switchcap is power-good.

  power-off-delay-ms:
    type: int
    description: Additional power-off delay in milliseconds.
