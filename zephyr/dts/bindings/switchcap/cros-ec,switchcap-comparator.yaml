description: |
  ChromiumOS Switchcap Driver with GPIO enable and comparator power-good

compatible: "cros-ec,switchcap-comparator"

properties:
  enable-gpios:
    type: phandle-array
    required: true
    description: Output GPIO used to enable the switchcap.

  power-good-comp:
    type: phandle
    required: true
    description: |
      Phandle to a Zephyr comparator device used to read switchcap
      power-good status.

  power-off-delay-ms:
    type: int
    description: Additional power-off delay in milliseconds.
