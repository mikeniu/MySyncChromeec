description: I2C port base properties

properties:
  i2c-port:
    type: phandle
    required: true
  remote-port:
    type: int
    description:
      A port number used by remote components like Kernel via the I2C_PASSTHRU
      Host Command
  enum-names:
    type: string-array
    required: true
    description:
      Enum values used in the source code to refer to the i2c port
  dynamic-speed:
    type: boolean
    description:
      Enables run-time speed configuration.
  protect-type:
    type: string
    default: I2C_PROTECT_TYPE_NONE
    description:
      Protection type for the I2C port.
    enum:
      - I2C_PROTECT_TYPE_NONE
      - PROTECT_IF_SYSTEM_IS_LOCKED
      - NO_PROTECT_UNTIL_ENABLED
  allow-passthru:
    type: string
    description:
      Function name of the allow-passthru function, which returns false if the
      i2c sequence is not allowed to passthru.
