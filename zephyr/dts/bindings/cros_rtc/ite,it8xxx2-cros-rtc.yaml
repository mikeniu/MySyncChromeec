description: ITE, it8xxx2 Real time clock (RTC) node

compatible: "ite,it8xxx2-cros-rtc"

include: base.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  data-mode:
    type: string
    default: "bcd"
    enum:
      - "bcd"
      - "bin"
    description: |
      RTC register data mode configuration.
      "bcd": RTC registers use BCD format.
      "bin": RTC registers use binary format.
      Default: "bcd".

  hour-mode:
    type: string
    default: "24h"
    enum:
      - "12h"
      - "24h"
    description: |
      RTC hour mode configuration.
      "24h": 24-hour time format.
      "12h": 12-hour time format (AM/PM).
      Default: "24h".

  alarm-sel:
    type: string
    default: "ALARM1"
    enum:
      - "ALARM1"
      - "ALARM2"
    description: |
      Selects which RTC alarm channel is used by this device instance.
      - ALARM1: Uses CTLREGB set BIT(5) to enable alarm1 interrupt
      - ALARM2: Uses CTLREGB set BIT(3) to enable alarm2 interrupt

  daylight-saving:
    type: boolean
    description: |
      Enable daylight saving (DS) adjustment.
      Spring: time advances from 1:59:59 AM to 3:00:00 AM
              on the first Sunday in April.
      Fall:   time returns from 1:59:59 AM to 1:00:00 AM
              on the last Sunday in October.
