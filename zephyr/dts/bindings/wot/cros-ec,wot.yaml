description: ChromeOS EC Wake-On-Touch (WOT) Controller

compatible: "cros-ec,wot"

include: base.yaml

properties:
  report-en-gpios:
    type: phandle-array
    required: true
    description: GPIO to enable touch screen reporting

  wot-l-gpios:
    type: phandle-array
    required: true
    description: GPIO to assert WOT state (Active Low)

  bl-detect-gpios:
    type: phandle-array
    required: true
    description: GPIO to detect EDP backlight state

  tchscr-int-gpios:
    type: phandle-array
    required: true
    description: GPIO for touch screen interrupt